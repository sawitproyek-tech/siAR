<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebAR Edukasi Anak</title>
    
    <!-- Tailwind CSS untuk Styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- A-Frame (Versi 1.2.0 lebih stabil untuk mobile) & AR.js -->
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/a3.js/build/ar.js"></script>
    
    <style>
        /* 1. Paksa latar belakang web menjadi transparan sepenuhnya */
        html, body { 
            background-color: transparent !important; 
            margin: 0; 
            overflow: hidden; 
            width: 100%;
            height: 100%;
        }
        
        /* 2. Mengurutkan lapisan: Video (Kamera) di paling belakang */
        video { 
            z-index: -2 !important; 
            position: absolute !important; 
            top: 0; 
            left: 0; 
            width: 100% !important;
            height: 100% !important;
            object-fit: cover;
        }
        
        /* 3. Lapisan objek 3D (Kanvas) di atas video kamera */
        .a-canvas { 
            z-index: -1 !important; 
        }
        
        /* 4. Lapisan UI (Tombol & Teks) di paling depan */
        #ui-layer { 
            z-index: 10 !important; 
        }
    </style>
</head>
<body>

    <!-- LAYER 1: KAMERA AR (Selalu berjalan di background) -->
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;" vr-mode-ui="enabled: false;">
        <!-- Marker 'Hiro' -->
        <a-marker preset="hiro">
            <!-- Objek 3D Kotak yang berputar -->
            <a-box position="0 0.5 0" material="color: #4f46e5;" animation="property: rotation; to: 0 360 0; loop: true; dur: 3000"></a-box>
        </a-marker>
        <a-entity camera></a-entity>
    </a-scene>

    <!-- LAYER 2: ANTARMUKA PENGGUNA (UI) -->
    <div id="ui-layer" class="absolute inset-0 pointer-events-none flex flex-col">
        
        <!-- HALAMAN HOME (Berfungsi sebagai "Tirai" penutup kamera saat awal dibuka) -->
        <section id="view-home" class="bg-slate-50 absolute inset-0 pointer-events-auto flex flex-col z-20">
            <header class="bg-indigo-600 text-white p-4 shadow-md text-center">
                <h1 class="text-xl font-bold">✨ AR Edukasi Anak</h1>
            </header>
            <main class="p-6 max-w-md mx-auto mt-10 text-center bg-white rounded-2xl shadow-sm border border-slate-100 w-full">
                <h2 class="text-2xl font-bold text-indigo-900 mb-2">Belajar Abjad 3D</h2>
                <p class="text-slate-500 text-sm mb-6">Siapkan gambar marker "Hiro", lalu mulai scan untuk memunculkan objek 3D.</p>
                <button onclick="goToARView()" class="w-full bg-gradient-to-r from-indigo-500 to-violet-600 text-white font-bold py-4 rounded-xl shadow-lg active:scale-95 transition transform">
                    🚀 Mulai Scan AR
                </button>
            </main>
        </section>

        <!-- HALAMAN OVERLAY AR (Tembus pandang ke kamera di belakangnya) -->
        <section id="view-ar" class="hidden absolute inset-0 flex-col justify-between p-4 pointer-events-none z-10">
            <div class="pointer-events-auto text-center mt-4">
                <span class="bg-white/90 backdrop-blur px-5 py-2 rounded-full font-bold text-slate-800 shadow-lg text-sm border border-slate-200">
                    📷 Arahkan ke marker "Hiro"
                </span>
            </div>
            <!-- Tombol Tutup ditaruh di bagian paling bawah layar -->
            <div class="pointer-events-auto mb-6 max-w-md mx-auto w-full mt-auto">
                <button onclick="goToHomeView()" class="w-full bg-slate-800 hover:bg-slate-900 text-white font-bold py-3.5 rounded-xl shadow-xl transition">
                    Tutup Kamera
                </button>
            </div>
        </section>

    </div>

    <!-- SCRIPT: LOGIKA BUKA/TUTUP HALAMAN (SPA) -->
    <script>
        function goToARView() {
            // Sembunyikan tirai halaman Home agar kamera di belakangnya terlihat
            document.getElementById('view-home').classList.add('hidden');
            
            // Tampilkan tombol "Tutup Kamera" dan teks instruksi
            const arView = document.getElementById('view-ar');
            arView.classList.remove('hidden');
            arView.classList.add('flex');
        }

        function goToHomeView() {
            // Tutup kembali kamera dengan menampilkan tirai halaman Home
            document.getElementById('view-home').classList.remove('hidden');
            
            // Sembunyikan elemen UI pada mode AR
            const arView = document.getElementById('view-ar');
            arView.classList.add('hidden');
            arView.classList.remove('flex');
        }
    </script>
</body>
</html>
