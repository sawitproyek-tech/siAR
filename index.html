<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebAR Edukasi</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- A-Frame & AR.js -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/a3.js/build/ar.js"></script>
</head>
<body style="margin: 0; overflow: hidden; background-color: transparent;">

    <!-- 1. KAMERA AR (Selalu berjalan di lapisan paling bawah) -->
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;" vr-mode-ui="enabled: false;">
        <a-marker preset="hiro">
            <a-box position="0 0.5 0" material="color: #4f46e5;" animation="property: rotation; to: 0 360 0; loop: true; dur: 3000"></a-box>
        </a-marker>
        <a-entity camera></a-entity>
    </a-scene>

    <!-- 2. UI LAYER (Lapisan antarmuka di atas kamera) -->
    <div id="ui-layer" class="absolute inset-0 z-10 pointer-events-none flex flex-col">
        
        <!-- HALAMAN HOME (Tirai solid penutup kamera) -->
        <section id="view-home" class="bg-slate-50 w-full h-full pointer-events-auto overflow-y-auto transition-opacity duration-300">
            <header class="bg-indigo-600 text-white p-4 shadow-md text-center">
                <h1 class="text-xl font-bold">✨ AR Edukasi Anak</h1>
            </header>
            <main class="p-6 max-w-md mx-auto mt-10 text-center bg-white rounded-2xl shadow-sm border border-slate-100">
                <h2 class="text-2xl font-bold text-indigo-900 mb-2">Belajar Abjad 3D</h2>
                <p class="text-slate-500 text-sm mb-6">Siapkan marker Hiro, lalu mulai scan untuk memunculkan objek 3D.</p>
                <button onclick="goToARView()" class="w-full bg-gradient-to-r from-indigo-500 to-violet-600 text-white font-bold py-4 rounded-xl shadow-lg active:scale-95 transition transform">
                    🚀 Mulai Scan AR
                </button>
            </main>
        </section>

        <!-- HALAMAN OVERLAY AR (Tembus pandang) -->
        <section id="view-ar" class="hidden w-full h-full flex-col justify-between p-4 pointer-events-none">
            <div class="pointer-events-auto text-center mt-4">
                <span class="bg-white/90 backdrop-blur px-5 py-2 rounded-full font-bold text-slate-800 shadow-lg text-sm border border-slate-200">
                    📷 Arahkan ke marker "Hiro"
                </span>
            </div>
            <div class="pointer-events-auto mb-6 max-w-md mx-auto w-full">
                <button onclick="goToHomeView()" class="w-full bg-slate-800 hover:bg-slate-900 text-white font-bold py-3.5 rounded-xl shadow-xl transition">
                    Tutup Kamera
                </button>
            </div>
        </section>
    </div>

    <!-- LOGIKA BUKA TUTUP TIRAI SPA -->
    <script>
        function goToARView() {
            // Sembunyikan layar Home
            document.getElementById('view-home').classList.add('hidden');
            // Tampilkan overlay layar AR
            const arView = document.getElementById('view-ar');
            arView.classList.remove('hidden');
            arView.classList.add('flex');
        }

        function goToHomeView() {
            // Tampilkan layar Home kembali
            document.getElementById('view-home').classList.remove('hidden');
            // Sembunyikan overlay layar AR
            const arView = document.getElementById('view-ar');
            arView.classList.add('hidden');
            arView.classList.remove('flex');
        }
    </script>
</body>
</html>
