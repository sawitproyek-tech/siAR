<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AR Edukasi Anak (MindAR)</title>

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

    <!-- MindAR Image Tracking untuk A-Frame -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
        /* Pengaturan Dasar SPA */
        html, body {
            background-color: #000;
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; 
            position: fixed; 
        }

        /* Membasmi elemen VR bawaan A-Frame */
        .a-enter-vr, .a-enter-ar, .a-orientation-modal {
            display: none !important;
        }

        /* UI aplikasi */
        #app {
            position: fixed;
            inset: 0;
            z-index: 999;
            pointer-events: none;
        }

        .clickable {
            pointer-events: auto;
        }

        /* Home */
        #home {
            position: fixed;
            inset: 0;
            z-index: 1000;
            background: #f8fafc;
            overflow-y: auto;
        }

        /* AR Control */
        #ar-control {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 1001;
            pointer-events: none;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
        }

        #ar-control.active {
            display: flex;
        }

        /* Loading */
        #loading {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 2000;
            background: rgba(0,0,0,.85);
            color: white;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        #loading.active {
            display: flex;
        }

        .spinner {
            width: 45px;
            height: 45px;
            border: 4px solid rgba(255,255,255,.3);
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

<!-- ======================================================
     AR SCENE (MindAR)
======================================================= -->
<!-- autoStart: false mencegah kamera menyala otomatis sebelum tombol diklik -->
<a-scene 
    id="ar-scene"
    mindar-image="imageTargetSrc: https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/image-tracking/assets/card-example/card.mind; autoStart: false; uiLoading: no; uiScanning: no;" 
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">
    
    <!-- Kamera Khusus MindAR -->
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- Target Gambar (Menggantikan Marker Hiro) -->
    <a-entity id="target-image" mindar-image-target="targetIndex: 0">
        <!-- Kubus -->
        <a-box 
            position="0 0 0" 
            material="color: #6366f1; opacity: 1;" 
            animation="property: rotation; to: 0 360 0; loop: true; dur: 3000; easing: linear;">
        </a-box>
        <!-- Huruf A -->
        <a-text 
            value="A" 
            position="0 0.8 0" 
            align="center" 
            color="#ffffff" 
            width="3">
        </a-text>
    </a-entity>
    
</a-scene>


<!-- ======================================================
     APPLICATION UI
======================================================= -->
<div id="app">

    <!-- HOME -->
    <section id="home">
        <header class="bg-indigo-600 text-white text-center p-5 shadow-lg">
            <div class="text-4xl mb-2">✨</div>
            <h1 class="text-2xl font-bold">AR Edukasi Anak</h1>
            <p class="text-indigo-100 text-sm mt-1">Teknologi MindAR - Portrait Mode</p>
        </header>

        <main class="max-w-md mx-auto px-5 pt-8">
            <div class="bg-white rounded-3xl shadow-xl p-6">
                <div class="w-24 h-24 mx-auto bg-indigo-100 rounded-3xl flex items-center justify-center text-5xl mb-6">🔤</div>
                <h2 class="text-2xl font-bold text-center text-slate-800">Belajar Abjad 3D</h2>
                <p class="text-center text-sm text-slate-500 mt-3 leading-relaxed">Arahkan kamera ke gambar sampel MindAR untuk melihat objek 3D secara penuh.</p>

                <!-- Start Button -->
                <button id="startAR" class="clickable w-full mt-6 py-4 rounded-2xl bg-gradient-to-r from-indigo-500 to-violet-600 text-white font-bold shadow-lg active:scale-95 transition">
                    🚀 Mulai Scan AR
                </button>
            </div>
        </main>
    </section>

    <!-- AR CONTROL -->
    <section id="ar-control">
        <!-- Status -->
        <div class="text-center">
            <span id="status" class="inline-block bg-white/95 px-5 py-3 rounded-full shadow-xl text-sm font-bold text-slate-800">📷 Mencari gambar target...</span>
        </div>
        <!-- Close -->
        <div class="clickable w-full max-w-md mx-auto mb-2">
            <button id="closeAR" class="w-full py-4 rounded-2xl bg-slate-900/90 text-white font-bold shadow-xl">✕ Tutup Kamera</button>
        </div>
    </section>

</div>

<!-- LOADING -->
<div id="loading">
    <div class="spinner"></div>
    <p class="font-bold">Membuka Kamera...</p>
</div>

<!-- ======================================================
     JAVASCRIPT
======================================================= -->
<script>
    const home = document.getElementById("home");
    const arControl = document.getElementById("ar-control");
    const startButton = document.getElementById("startAR");
    const closeButton = document.getElementById("closeAR");
    const status = document.getElementById("status");
    const loading = document.getElementById("loading");
    
    // Elemen scene dan target gambar
    const sceneEl = document.getElementById("ar-scene");
    const targetEl = document.getElementById("target-image");

    /* START AR */
    startButton.addEventListener("click", function() {
        home.style.display = "none";
        loading.classList.add("active");
        
        // Memulai mesin MindAR secara manual setelah tombol diklik
        sceneEl.systems["mindar-image-system"].start();
    });

    /* DETEKSI SAAT MINDAR SELESAI MEMUAT KAMERA */
    sceneEl.addEventListener("arReady", function() {
        loading.classList.remove("active");
        arControl.classList.add("active");
    });

    /* CLOSE AR */
    closeButton.addEventListener("click", function() {
        arControl.classList.remove("active");
        home.style.display = "block";
        
        // Menghentikan kamera untuk menghemat baterai saat kembali ke menu
        sceneEl.systems["mindar-image-system"].stop();
    });

    /* TARGET FOUND (Pengganti markerFound) */
    targetEl.addEventListener("targetFound", function() {
        status.textContent = "🎉 Gambar ditemukan!";
        status.classList.remove("text-slate-800");
        status.classList.add("text-green-700");
    });

    /* TARGET LOST (Pengganti markerLost) */
    targetEl.addEventListener("targetLost", function() {
        status.textContent = "📷 Mencari gambar target...";
        status.classList.remove("text-green-700");
        status.classList.add("text-slate-800");
    });

    /* ERROR CAMERA */
    sceneEl.addEventListener("arError", function() {
        loading.classList.remove("active");
        alert("Gagal memuat kamera. Pastikan izin kamera telah diberikan.");
        home.style.display = "block";
    });
</script>

</body>
</html>
